apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: demo-app:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-app-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  strategy:
    canary:
      # No traffic-management plugin configured: with a single Service
      # selecting `app: demo-app`, Argo Rollouts approximates each setWeight
      # by adjusting the canary/stable ReplicaSet split directly (basic
      # canary). At replicas: 5, 20% ~= 1 pod, 40% ~= 2 pods, etc.
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
              - templateName: latency-p99
            args:
              - name: service-name
                value: demo-app
        - setWeight: 40
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
              - templateName: latency-p99
            args:
              - name: service-name
                value: demo-app
        - setWeight: 100
